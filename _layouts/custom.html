---
layout: base
title: Blog
---

<h1>Blog</h1>

{% assign posts_by_year = site.posts | group_by_exp:"post", "post.date | date: '%Y'" %}

{% for year in posts_by_year %}
  <h2>{{ year.name }}</h2>
  <ul>
    {% for post in year.items %}
      <!-- <li> -->
        {{ post.date | date: "%b %d "}}  &nbsp; <a href="{{ post.url }}">{{ post.title }}</a> <br>
      <!-- </li> -->
    {% endfor %}
  </ul>
{% endfor %}
