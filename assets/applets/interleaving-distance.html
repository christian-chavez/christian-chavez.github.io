<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interleaving distance of interval modules</title>
<style>
  :root {
    --ink: #2e2d2d;
    --red: #ff2a2a;
    --blue: #0055ff;
    --teal: #0f766e;
    --grid: #e3e6ea;
    --line: #c8ccd2;
    --paper: #ffffff;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: "MLModern Serif", serif;
    user-select: none;
    -webkit-user-select: none;
  }
  i { font-style: italic; }
  b { font-weight: bold; }

  /* Everything is laid out on a 900 × 600 stage (the iframe size in the deck),
     then scaled to fit whatever window it is in. */
  #stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 900px;
    height: 600px;
    transform-origin: 0 0;
  }

  .vals {
    position: absolute;
    left: 40px;
    top: 44px;
    font-size: 26px;
  }
  .val {
    display: flex;
    align-items: center;
    height: 50px;
    white-space: pre;
  }
  .val i.I { color: var(--red); }
  .val i.J { color: var(--blue); }
  input, button { font-family: "MLModern Sans", sans-serif; }
  input {
    margin: 0 0.12em;
    padding: 0.08em 0.3em;
    font-size: 21px;
    text-align: center;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 6px;
    user-select: text;
    -webkit-user-select: text;
  }
  input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.25); }

  .presets {
    position: absolute;
    right: 40px;
    top: 50px;
    display: flex;
    gap: 8px;
  }
  button {
    font-size: 19px;
    padding: 0.3em 0.8em;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 7px;
    cursor: pointer;
  }
  button:hover { border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  #fig {
    position: absolute;
    left: 0;
    top: 160px;
    width: 900px;
    height: 290px;
    touch-action: none;
  }
  #fig .grid { stroke: var(--grid); stroke-width: 1.5; }
  #fig .axis, #fig .tick { stroke: var(--ink); stroke-width: 1.5; }
  #fig .ticklbl { font-size: 21px; fill: var(--ink); text-anchor: middle; }
  #fig .name { font-size: 29px; font-style: italic; text-anchor: middle; fill: currentColor; }
  #fig .block { fill: currentColor; fill-opacity: 0.2; }
  #fig .edge { stroke: currentColor; stroke-width: 3; }
  #fig .edge.hot { stroke-width: 5; }
  #fig.resize { cursor: ew-resize; }
  #fig.draw { cursor: crosshair; }
  #fig.move { cursor: grab; }
  #fig.moving { cursor: grabbing; }

  /* d_T(k^I, k^J) = value: the left part never moves, only the number changes */
  .result {
    position: absolute;
    left: 0;
    top: 486px;
    width: 900px;
    display: flex;
    justify-content: center;
    align-items: baseline;
    font-size: 38px;
    white-space: pre;
  }
  .result .value { flex: none; width: 4.6ch; text-align: left; }
  sub, sup { position: relative; font-size: 0.7em; line-height: 0; vertical-align: baseline; }
  sub { top: 0.25em; }
  sup { top: -0.45em; }
</style>

<body>
<div id="stage">

  <div class="vals">
    <div class="val"><i class="I">I</i> = [<input id="a" data-iv="I" data-end="0" aria-label="a"
      autocomplete="off" spellcheck="false" inputmode="decimal">, <input id="b" data-iv="I" data-end="1" aria-label="b"
      autocomplete="off" spellcheck="false" inputmode="decimal">]</div>
    <div class="val"><i class="J">J</i> = [<input id="c" data-iv="J" data-end="0" aria-label="c"
      autocomplete="off" spellcheck="false" inputmode="decimal">, <input id="d" data-iv="J" data-end="1" aria-label="d"
      autocomplete="off" spellcheck="false" inputmode="decimal">]</div>
  </div>

  <div class="presets">
    <button data-preset="match">match</button>
    <button data-preset="die">both die</button>
    <button data-preset="same">same</button>
  </div>

  <svg id="fig" viewBox="0 0 900 290" aria-label="The intervals I and J on the real line; drag them, drag their ends, or drag along a track to draw a new one">
    <g id="grid"></g>
    <g id="I" style="color: var(--red)">
      <text class="name" x="40" y="105">I</text>
      <rect class="block" y="82" height="26"></rect>
      <line class="edge" data-end="0" y1="82" y2="108"></line>
      <line class="edge" data-end="1" y1="82" y2="108"></line>
    </g>
    <g id="J" style="color: var(--blue)">
      <text class="name" x="40" y="170">J</text>
      <rect class="block" y="147" height="26"></rect>
      <line class="edge" data-end="0" y1="147" y2="173"></line>
      <line class="edge" data-end="1" y1="147" y2="173"></line>
    </g>
  </svg>

  <div class="result" aria-live="polite">
    <span><i>d</i><sub><i>T</i></sub>(<b>k</b><sup><i>I</i></sup>, <b>k</b><sup><i>J</i></sup>) = </span><span class="value" id="dist"></span>
  </div>

</div>
<script>
(() => {
  const X0 = 80, X1 = 840, TOP = 30, LANE = { I: 95, J: 160 }, AXIS = 225;
  const GRAB = 14;           // how close (stage px) a press must be to an end to grab it
  const LIMIT = 1e9;         // typed values are clamped to [−LIMIT, LIMIT]

  // ---------- exact decimals ----------
  // A value is { n, s }, meaning n / 10^s with n a BigInt, so the distance is exact.
  const TEN = 10n;
  function dec(n, s = 0) {
    n = BigInt(n);
    while (s > 0 && n % TEN === 0n) { n /= TEN; s--; }
    return { n, s };
  }
  const scaled = (x, s) => x.n * TEN ** BigInt(s - x.s);   // x · 10^s, for s ≥ x.s
  const cmp = (x, y) => { const s = Math.max(x.s, y.s), p = scaled(x, s), q = scaled(y, s); return p < q ? -1 : p > q ? 1 : 0; };
  const add = (x, y) => { const s = Math.max(x.s, y.s); return dec(scaled(x, s) + scaled(y, s), s); };
  const sub = (x, y) => add(x, { n: -y.n, s: y.s });
  const num = x => Number(x.n) / 10 ** x.s;                // for drawing only
  function text(x) {
    const neg = x.n < 0n, digits = (neg ? -x.n : x.n).toString().padStart(x.s + 1, '0');
    const cut = digits.length - x.s;
    return (neg ? '−' : '') + digits.slice(0, cut) + (x.s ? '.' + digits.slice(cut) : '');
  }
  // x ≥ 0 rounded (half up) to at most 3 decimals; trailing zeros are dropped by dec
  function round3(x) {
    if (x.s <= 3) return x;
    const q = TEN ** BigInt(x.s - 3);
    return dec(x.n / q + (2n * (x.n % q) >= q ? 1n : 0n), 3);
  }
  // "2.5", "-3", "−3", "2,5", "1e6" … → an exact decimal, or null
  function parse(str) {
    const m = /^([+-]?)(\d*)(?:\.(\d*))?(?:e([+-]?\d{1,2}))?$/i
      .exec(str.replace(/\s+/g, '').replace(/−/g, '-').replace(',', '.'));
    if (!m || m[2] + (m[3] || '') === '') return null;
    const frac = m[3] || '';
    let n = BigInt(m[2] + frac), s = frac.length - Number(m[4] || 0);
    if (s < 0) { n *= TEN ** BigInt(-s); s = 0; }
    let x = dec(m[1] === '-' ? -n : n, s);
    if (cmp(x, dec(LIMIT)) > 0) x = dec(LIMIT);
    if (cmp(x, dec(-LIMIT)) < 0) x = dec(-LIMIT);
    return x;
  }

  // ---------- the distance ----------
  // d = min( max(|a−c|, |b−d|), max((b−a)/2, (d−c)/2) ), computed on integers in
  // units of 10^−S / 2 so that the halves stay exact.
  function distance([a, b], [c, d]) {
    const S = Math.max(a.s, b.s, c.s, d.s);
    const [A, B, C, D] = [a, b, c, d].map(x => scaled(x, S));
    const abs = x => (x < 0n ? -x : x), max = (x, y) => (x > y ? x : y);
    const match = 2n * max(abs(A - C), abs(B - D));
    const die = max(B - A, D - C);
    return dec(5n * (match < die ? match : die), S + 1);   // m / (2 · 10^S)
  }

  const state = {};
  const PRESETS = {
    match: { I: ['-4', '4'], J: ['-2', '6'] },   // d = 2, shift to match
    die:   { I: ['-5', '-3'], J: ['3', '5'] },   // d = 1, shift until both die
    same:  { I: ['-4', '4'], J: ['-4', '4'] },   // d = 0
  };

  // ---------- the visible part of the line ----------
  // [−10, 10] by default, widened (with round ticks) when a value falls outside.
  const view = { lo: -10, hi: 10, step: 2 };
  const px = v => X0 + (v - view.lo) / (view.hi - view.lo) * (X1 - X0);
  const tickText = t => (t < 0 ? '−' + -t : String(t));

  function fitView() {
    const vals = [...state.I, ...state.J].map(num);
    const lo = Math.min(-10, ...vals), hi = Math.max(10, ...vals);
    for (let k = 0; ; k++) {
      for (const m of [1, 2, 5]) {
        const step = m * 10 ** k;
        const L = Math.floor(lo / step) * step, H = Math.ceil(hi / step) * step;
        const count = Math.round((H - L) / step);
        const label = Math.max(tickText(L).length, tickText(H).length) * 11 + 16;
        if (count <= 10 && (X1 - X0) / count >= label) {
          Object.assign(view, { lo: L, hi: H, step });
          return drawGrid();
        }
      }
    }
  }

  const $ = id => document.getElementById(id);
  const SVGNS = 'http://www.w3.org/2000/svg';
  function el(parent, tag, attrs, content) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (content !== undefined) e.textContent = content;
    parent.appendChild(e);
    return e;
  }
  function drawGrid() {
    const g = $('grid');
    g.replaceChildren();
    for (const y of [TOP, LANE.I, LANE.J]) el(g, 'line', { class: 'grid', x1: X0, x2: X1, y1: y, y2: y });
    for (let t = view.lo; t <= view.hi + view.step / 2; t += view.step) {
      const x = px(t);
      el(g, 'line', { class: 'grid', x1: x, x2: x, y1: TOP, y2: AXIS });
      el(g, 'line', { class: 'tick', x1: x, x2: x, y1: AXIS - 7, y2: AXIS + 7 });
      el(g, 'text', { class: 'ticklbl', x, y: AXIS + 38 }, tickText(t));
    }
    el(g, 'line', { class: 'axis', x1: X0, x2: X1, y1: AXIS, y2: AXIS });
  }

  // ---------- drawing ----------
  const inputs = [...document.querySelectorAll('input')];
  const fitBox = inp => { inp.style.width = Math.max(4, inp.value.length + 1.5) + 'ch'; };

  function render() {
    for (const name of ['I', 'J']) {
      const [xa, xb] = state[name].map(v => px(num(v))), g = $(name);
      const block = g.querySelector('.block');
      block.setAttribute('x', xa);
      block.setAttribute('width', xb - xa);
      g.querySelectorAll('.edge').forEach(e => {
        const x = e.dataset.end === '0' ? xa : xb;
        e.setAttribute('x1', x);
        e.setAttribute('x2', x);
      });
    }
    for (const inp of inputs) {
      inp.value = text(state[inp.dataset.iv][+inp.dataset.end]);
      fitBox(inp);
    }
    $('dist').textContent = text(round3(distance(state.I, state.J)));
  }

  // Keep a ≤ b and c ≤ d by clamping the end that moves.
  function setEnd(name, end, x) {
    const iv = state[name], other = iv[1 - end];
    iv[end] = (end === 0 ? cmp(x, other) > 0 : cmp(x, other) < 0) ? other : x;
  }

  // ---------- the mouse ----------
  // Near an end of an interval: drag that end. Inside it: move the whole interval.
  // Elsewhere on its track: draw a new interval.
  const fig = $('fig');
  let drag = null;   // what target() found, plus where the press started; end is null while touching ends wait for a direction

  function stageXY(e) {
    const r = fig.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * 900, (e.clientY - r.top) / r.height * 290];
  }
  // A number rounded to the screen's resolution, as an exact decimal (so it stays short).
  function snap(v) {
    const e = Math.floor(Math.log10((view.hi - view.lo) / (X1 - X0)));
    const k = Math.round(v / 10 ** e);
    return e < 0 ? dec(k, -e) : dec(BigInt(k) * TEN ** BigInt(e));
  }
  const valueAt = x => snap(Math.min(view.hi, Math.max(view.lo, view.lo + (x - X0) / (X1 - X0) * (view.hi - view.lo))));

  // What a press at (x, y) would do.
  function target(x, y) {
    for (const name of ['I', 'J']) {
      if (Math.abs(y - LANE[name]) > 30) continue;
      const [xa, xb] = state[name].map(v => px(num(v)));
      if (x >= xa - GRAB && x <= xb + GRAB) {
        const inner = Math.min(GRAB, (xb - xa) / 4);   // how far inside an end still grabs that end
        if (x > xa + inner && x < xb - inner) return { name, move: true };
        return { name, end: xb - xa < 6 ? null : Math.abs(x - xa) <= Math.abs(x - xb) ? 0 : 1 };
      }
      if (x >= X0 - 10 && x <= X1 + 10) return { name, draw: true };
    }
    return null;
  }
  function hover(t) {
    fig.querySelectorAll('.edge.hot').forEach(e => e.classList.remove('hot'));
    fig.classList.toggle('resize', !!t && 'end' in t);
    fig.classList.toggle('draw', !!t && !!t.draw);
    fig.classList.toggle('move', !!t && !!t.move);
    if (!t || !('end' in t)) return;
    const ends = t.end === null ? '.edge' : `.edge[data-end="${t.end}"]`;
    $(t.name).querySelectorAll(ends).forEach(e => e.classList.add('hot'));
  }

  fig.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const [x, y] = stageXY(e), t = target(x, y);
    if (!t) return;
    drag = { ...t, x0: x, v0: valueAt(x), from: state[t.name], moved: false };
    hover(t);
    fig.classList.toggle('moving', !!t.move);
    fig.setPointerCapture(e.pointerId);
  });
  fig.addEventListener('pointermove', e => {
    const [x, y] = stageXY(e);
    if (!drag) return hover(target(x, y));
    if (!drag.moved && Math.abs(x - drag.x0) < 3) return;   // a plain click changes nothing
    drag.moved = true;
    const v = valueAt(x);
    if (drag.draw) {
      state[drag.name] = cmp(v, drag.v0) < 0 ? [v, drag.v0] : [drag.v0, v];
    } else if (drag.move) {
      // shift both ends by the same exact amount, keeping the interval on the visible line
      const [a, b] = drag.from;
      let shift = snap((x - drag.x0) / (X1 - X0) * (view.hi - view.lo));
      const least = sub(dec(view.lo), a), most = sub(dec(view.hi), b);
      if (cmp(shift, least) < 0) shift = least;
      if (cmp(shift, most) > 0) shift = most;
      state[drag.name] = [add(a, shift), add(b, shift)];
    } else {
      if (drag.end === null) {
        drag.end = x < drag.x0 ? 0 : 1;   // touching ends separate the way they are pulled
        hover(drag);
      }
      setEnd(drag.name, drag.end, v);
    }
    render();
  });
  function endDrag() {
    drag = null;
    hover(null);
    fig.classList.remove('moving');
  }
  fig.addEventListener('pointerup', endDrag);
  fig.addEventListener('pointercancel', endDrag);
  fig.addEventListener('lostpointercapture', endDrag);
  fig.addEventListener('pointerleave', () => { if (!drag) hover(null); });

  // ---------- typing ----------
  function commit(inp) {
    const x = parse(inp.value);
    if (x) setEnd(inp.dataset.iv, +inp.dataset.end, x);
    fitView();
    render();   // shows the value as stored, or the old one if the box was unreadable
  }
  for (const inp of inputs) {
    inp.addEventListener('change', () => commit(inp));
    inp.addEventListener('focus', () => inp.select());
    inp.addEventListener('input', () => fitBox(inp));
  }

  // ---------- presets ----------
  function preset(name) {
    const p = PRESETS[name];
    state.I = p.I.map(parse);
    state.J = p.J.map(parse);
    fitView();
    render();
  }
  document.querySelectorAll('button[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      preset(btn.dataset.preset);
      btn.blur();   // so Space goes to the deck, not to the button again
    });
  });

  // ---------- keyboard ----------
  // Keys typed in a box stay in the iframe, so reveal.js never sees them.
  // Elsewhere, navigation keys are passed to reveal.js (its postMessage API), and
  // the focus goes back to the deck so the next keys reach it directly.
  const NAV = { ArrowRight: 'right', ArrowLeft: 'left', ArrowDown: 'down', ArrowUp: 'up',
                PageDown: 'next', PageUp: 'prev', ' ': 'next' };
  window.addEventListener('keydown', e => {
    const t = e.target;
    if (t instanceof HTMLInputElement) {
      if (e.key === 'Enter') { commit(t); t.blur(); }
      else if (e.key === 'Escape') { render(); t.blur(); }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    let method = NAV[e.key];
    if (!method || window.parent === window) return;
    if (e.key === ' ' && e.shiftKey) method = 'prev';
    e.preventDefault();
    window.parent.postMessage(JSON.stringify({ method, args: [] }), '*');
    window.parent.focus();
  });

  // ---------- fit the stage to the window ----------
  const stage = $('stage');
  function fit() {
    const s = Math.min(innerWidth / 900, innerHeight / 600);
    stage.style.transform =
      `translate(${(innerWidth - 900 * s) / 2}px, ${(innerHeight - 600 * s) / 2}px) scale(${s})`;
  }
  window.addEventListener('resize', fit);
  fit();
  preset('match');

  // Test hook
  window.__interleaving = {
    state, view, PRESETS, distance, parse, text, round3,
    values: () => ['I', 'J'].map(n => state[n].map(text)),
    shown: () => $('dist').textContent,
  };
})();
</script>
</body>
</html>
